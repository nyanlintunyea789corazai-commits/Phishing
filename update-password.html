<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A2F30">
  <title>Choose a new password – Your Brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <aside class="brand">
      <a class="wordmark" href="index.html">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <path d="M3 26V13a10 10 0 0 1 20 0v13" fill="none" stroke="#F2B632" stroke-width="3"/>
        </svg>
        Your Brand
      </a>
      <div>
        <h2 class="headline">Choose a new password.</h2>
        <p class="subline">Then you're back in.</p>
      </div>
      <svg class="arches" viewBox="0 0 400 520" aria-hidden="true" focusable="false">
        <path pathLength="1" d="M32 520V240A168 168 0 0 1 368 240V520"/>
        <path pathLength="1" d="M66 520V240A134 134 0 0 1 334 240V520"/>
        <path pathLength="1" d="M100 520V240A100 100 0 0 1 300 240V520"/>
        <path pathLength="1" d="M134 520V240A66 66 0 0 1 266 240V520"/>
        <path pathLength="1" class="lit" d="M168 520V240A32 32 0 0 1 232 240V520"/>
      </svg>
    </aside>

    <main class="panel">
      <div class="signin">
        <h1>New password</h1>

        <p class="lede" id="gate" role="status">Checking your reset link…</p>

        <form id="update-form" novalidate hidden>
          <div class="field">
            <div class="label-row"><label for="password">New password</label></div>
            <div class="pw">
              <input id="password" name="password" type="password"
                     autocomplete="new-password" required minlength="8"
                     aria-describedby="password-hint password-error caps-hint">
              <button class="toggle" id="toggle-password" type="button"
                      aria-controls="password confirm" aria-label="Show password">Show</button>
            </div>
            <p class="hint" id="password-hint">Use at least 8 characters.</p>
            <p class="hint" id="caps-hint" hidden>Caps Lock is on.</p>
            <p class="error" id="password-error" hidden></p>
          </div>

          <div class="field">
            <div class="label-row"><label for="confirm">Confirm new password</label></div>
            <input id="confirm" name="confirm" type="password"
                   autocomplete="new-password" required aria-describedby="confirm-error">
            <p class="error" id="confirm-error" hidden></p>
          </div>

          <p class="status" id="form-status" role="status" aria-live="polite"></p>

          <button class="submit" id="submit" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Save new password</span>
          </button>
        </form>

        <p class="alt"><a href="index.html">Back to sign in</a></p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="ui.js"></script>
  <script>
    (() => {
      const gate      = document.getElementById("gate");
      const form      = document.getElementById("update-form");
      const password  = document.getElementById("password");
      const confirm   = document.getElementById("confirm");
      const status    = document.getElementById("form-status");
      const submitBtn = document.getElementById("submit");
      const errors = {
        password: document.getElementById("password-error"),
        confirm:  document.getElementById("confirm-error"),
      };

      ui.bindPasswordToggle(document.getElementById("toggle-password"), password, confirm);
      ui.bindCapsLock(password, document.getElementById("caps-hint"));

      if (!isConfigured) {
        gate.textContent = ui.demoMessage;
        return;
      }

      let shown = false;
      function showForm() {
        if (shown) return;
        shown = true;
        gate.hidden = true;
        form.hidden = false;
        password.focus();
      }

      /* The reset link signs the person in briefly so they can set a new password */
      sb.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) showForm();
      });
      setTimeout(async () => {
        if (shown) return;
        const { data } = await sb.auth.getSession();
        if (data && data.session) showForm();
        else gate.textContent = "This reset link has expired or was already used. Request a new one from the Forgot password page.";
      }, 1800);

      password.addEventListener("input", () => { ui.setError(password, errors.password, ""); ui.setStatus(status, ""); });
      confirm.addEventListener("input",  () => { ui.setError(confirm, errors.confirm, ""); ui.setStatus(status, ""); });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        ui.setStatus(status, "");

        const pass = password.value;
        const again = confirm.value;
        const passProblem = !pass ? "Choose a password."
          : pass.length < 8 ? "Use at least 8 characters." : "";
        const confirmProblem = !again ? "Type your password again."
          : again !== pass ? "The passwords don't match." : "";
        ui.setError(password, errors.password, passProblem);
        ui.setError(confirm, errors.confirm, confirmProblem);
        if (passProblem) { password.focus(); return; }
        if (confirmProblem) { confirm.focus(); return; }

        ui.setBusy(submitBtn, true, "Save new password", "Saving…");
        try {
          const { error } = await sb.auth.updateUser({ password: pass });
          if (error) {
            ui.setStatus(status, ui.friendlyAuthError(error), "error");
          } else {
            ui.setStatus(status, "Password saved. Taking you to your account…", "ok");
            setTimeout(() => window.location.assign(SITE.afterLogin), 1200);
            return;
          }
        } catch (_) {
          ui.setStatus(status, "Can't reach the server. Check your connection and try again.", "error");
        }
        ui.setBusy(submitBtn, false, "Save new password", "Saving…");
      });
    })();
  </script>
</body>
</html>
