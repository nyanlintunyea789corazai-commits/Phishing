<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A2F30">
  <meta name="description" content="Sign in to your account.">
  <title>Sign in – Your Brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <!-- Brand side: replace the name, tagline and logo mark with your own -->
    <aside class="brand">
      <a class="wordmark" href="index.html">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <path d="M3 26V13a10 10 0 0 1 20 0v13" fill="none" stroke="#F2B632" stroke-width="3"/>
        </svg>
        Your Brand
      </a>
      <div>
        <h2 class="headline">Welcome back.</h2>
        <p class="subline">Sign in to pick up where you left off.</p>
      </div>
      <svg class="arches" viewBox="0 0 400 520" aria-hidden="true" focusable="false">
        <path pathLength="1" d="M32 520V240A168 168 0 0 1 368 240V520"/>
        <path pathLength="1" d="M66 520V240A134 134 0 0 1 334 240V520"/>
        <path pathLength="1" d="M100 520V240A100 100 0 0 1 300 240V520"/>
        <path pathLength="1" d="M134 520V240A66 66 0 0 1 266 240V520"/>
        <path pathLength="1" class="lit" d="M168 520V240A32 32 0 0 1 232 240V520"/>
      </svg>
    </aside>

    <main class="panel">
      <div class="signin">
        <h1>Sign in</h1>
        <p class="lede">Enter your email and password to continue.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <div class="label-row"><label for="email">Email</label></div>
            <input id="email" name="email" type="email" inputmode="email"
                   autocomplete="username" autocapitalize="none" autocorrect="off"
                   spellcheck="false" required aria-describedby="email-error">
            <p class="error" id="email-error" hidden></p>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password</label>
              <a class="forgot" href="forgot-password.html">Forgot password?</a>
            </div>
            <div class="pw">
              <input id="password" name="password" type="password"
                     autocomplete="current-password" required
                     aria-describedby="password-error caps-hint">
              <button class="toggle" id="toggle-password" type="button"
                      aria-controls="password" aria-label="Show password">Show</button>
            </div>
            <p class="hint" id="caps-hint" hidden>Caps Lock is on.</p>
            <p class="error" id="password-error" hidden></p>
          </div>

          <label class="check">
            <input type="checkbox" id="remember" name="remember">
            Remember my email on this device
          </label>

          <p class="status" id="form-status" role="status" aria-live="polite"></p>

          <button class="submit" id="submit" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Sign in</span>
          </button>
        </form>

        <p class="alt">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="ui.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = "login.email";

      const form      = document.getElementById("login-form");
      const email     = document.getElementById("email");
      const password  = document.getElementById("password");
      const remember  = document.getElementById("remember");
      const status    = document.getElementById("form-status");
      const submitBtn = document.getElementById("submit");
      const errors = {
        email:    document.getElementById("email-error"),
        password: document.getElementById("password-error"),
      };

      ui.bindPasswordToggle(document.getElementById("toggle-password"), password);
      ui.bindCapsLock(password, document.getElementById("caps-hint"));

      /* Remembered email (only the email is stored, never the password) */
      const saved = ui.store.get(STORAGE_KEY);
      if (saved) { email.value = saved; remember.checked = true; password.focus(); }
      else { email.focus(); }

      email.addEventListener("input", () => { ui.setError(email, errors.email, ""); ui.setStatus(status, ""); });
      password.addEventListener("input", () => { ui.setError(password, errors.password, ""); ui.setStatus(status, ""); });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        ui.setStatus(status, "");

        const mail = email.value.trim();
        const pass = password.value;

        const mailProblem = !mail ? "Enter your email."
          : !ui.isEmail(mail) ? "Enter a valid email address, like name@example.com." : "";
        const passProblem = pass ? "" : "Enter your password.";
        ui.setError(email, errors.email, mailProblem);
        ui.setError(password, errors.password, passProblem);
        if (mailProblem) { email.focus(); return; }
        if (passProblem) { password.focus(); return; }

        if (remember.checked) ui.store.set(STORAGE_KEY, mail);
        else ui.store.remove(STORAGE_KEY);

        ui.setBusy(submitBtn, true, "Sign in", "Signing in…");

        if (!isConfigured) {
          await ui.wait(600);
          ui.setStatus(status, ui.demoMessage, "ok");
          ui.setBusy(submitBtn, false, "Sign in", "Signing in…");
          return;
        }

        try {
          const { error } = await sb.auth.signInWithPassword({ email: mail, password: pass });
          if (error) {
            ui.setStatus(status, ui.friendlyAuthError(error), "error");
            if (error.code === "invalid_credentials") password.select();
          } else {
            ui.setStatus(status, "Signed in. Taking you to your account…", "ok");
            window.location.assign(SITE.afterLogin);
            return;
          }
        } catch (_) {
          ui.setStatus(status, "Can't reach the server. Check your connection and try again.", "error");
        }
        ui.setBusy(submitBtn, false, "Sign in", "Signing in…");
      });

      /* Already signed in? Skip the form. */
      if (isConfigured) {
        sb.auth.getSession().then(({ data }) => {
          if (data && data.session) window.location.replace(SITE.afterLogin);
        });
      }
    })();
  </script>
</body>
</html>
