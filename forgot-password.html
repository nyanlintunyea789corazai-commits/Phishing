<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A2F30">
  <title>Reset password – Your Brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <aside class="brand">
      <a class="wordmark" href="index.html">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <path d="M3 26V13a10 10 0 0 1 20 0v13" fill="none" stroke="#F2B632" stroke-width="3"/>
        </svg>
        Your Brand
      </a>
      <div>
        <h2 class="headline">Reset your password.</h2>
        <p class="subline">We'll email you a link to choose a new one.</p>
      </div>
      <svg class="arches" viewBox="0 0 400 520" aria-hidden="true" focusable="false">
        <path pathLength="1" d="M32 520V240A168 168 0 0 1 368 240V520"/>
        <path pathLength="1" d="M66 520V240A134 134 0 0 1 334 240V520"/>
        <path pathLength="1" d="M100 520V240A100 100 0 0 1 300 240V520"/>
        <path pathLength="1" d="M134 520V240A66 66 0 0 1 266 240V520"/>
        <path pathLength="1" class="lit" d="M168 520V240A32 32 0 0 1 232 240V520"/>
      </svg>
    </aside>

    <main class="panel">
      <div class="signin">
        <h1>Reset password</h1>
        <p class="lede">Enter the email you signed up with.</p>

        <form id="forgot-form" novalidate>
          <div class="field">
            <div class="label-row"><label for="email">Email</label></div>
            <input id="email" name="email" type="email" inputmode="email"
                   autocomplete="username" autocapitalize="none" autocorrect="off"
                   spellcheck="false" required aria-describedby="email-error">
            <p class="error" id="email-error" hidden></p>
          </div>

          <p class="status" id="form-status" role="status" aria-live="polite"></p>

          <button class="submit" id="submit" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Send reset link</span>
          </button>
        </form>

        <p class="alt"><a href="index.html">Back to sign in</a></p>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="ui.js"></script>
  <script>
    (() => {
      const form      = document.getElementById("forgot-form");
      const email     = document.getElementById("email");
      const status    = document.getElementById("form-status");
      const submitBtn = document.getElementById("submit");
      const emailErr  = document.getElementById("email-error");

      email.focus();
      email.addEventListener("input", () => { ui.setError(email, emailErr, ""); ui.setStatus(status, ""); });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        ui.setStatus(status, "");

        const mail = email.value.trim();
        const problem = !mail ? "Enter your email."
          : !ui.isEmail(mail) ? "Enter a valid email address, like name@example.com." : "";
        ui.setError(email, emailErr, problem);
        if (problem) { email.focus(); return; }

        ui.setBusy(submitBtn, true, "Send reset link", "Sending…");

        if (!isConfigured) {
          await ui.wait(600);
          ui.setStatus(status, ui.demoMessage, "ok");
          ui.setBusy(submitBtn, false, "Send reset link", "Sending…");
          return;
        }

        try {
          const { error } = await sb.auth.resetPasswordForEmail(mail, {
            redirectTo: new URL(SITE.updatePage, window.location.href).href,
          });
          if (error && (error.status === 429 || /rate/i.test(error.code || ""))) {
            ui.setStatus(status, ui.friendlyAuthError(error), "error");
          } else {
            /* Same message whether or not the email has an account, so nobody can probe for accounts */
            ui.setStatus(status, "If an account exists for " + mail + ", we've sent a reset link. Check your inbox.", "ok");
          }
        } catch (_) {
          ui.setStatus(status, "Can't reach the server. Check your connection and try again.", "error");
        }
        ui.setBusy(submitBtn, false, "Send reset link", "Sending…");
      });
    })();
  </script>
</body>
</html>
